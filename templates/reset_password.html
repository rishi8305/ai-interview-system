{% extends "base.html" %}

{% block title %}Set New Password - AI Interview System{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        
        <!-- Header Banner -->
        <div class="p-4 bg-primary text-white text-center">
          <div class="mb-2">
            <span class="p-3 bg-white bg-opacity-25 rounded-circle d-inline-flex align-items-center justify-content-center">
              <i class="bi bi-shield-check fs-2 text-white"></i>
            </span>
          </div>
          <h4 class="fw-bold mb-1">Set New Password</h4>
          <p class="small text-white-50 mb-0">Choose a new password for <strong>{{ email }}</strong></p>
        </div>

        <div class="card-body p-4 p-md-5">
          <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            
            <div class="mb-3">
              <label for="password" class="form-label fw-semibold small">New Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control border-start-0" id="password" name="password" minlength="6" placeholder="At least 6 characters" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label fw-semibold small">Confirm New Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" minlength="6" placeholder="Re-enter new password" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-2 fw-semibold mb-3">
              <i class="bi bi-check-lg me-1"></i> Update Password &amp; Sign In
            </button>
          </form>

          <div class="text-center mt-3 pt-3 border-top">
            <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-decoration-none text-secondary">
              <i class="bi bi-arrow-left me-1"></i> Return to Sign In
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
