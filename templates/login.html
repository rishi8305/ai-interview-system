{% extends "base.html" %}

{% block title %}Sign In - AI Interview System{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="p-4 bg-primary text-white text-center">
          <div class="mb-2">
            <span class="p-3 bg-white bg-opacity-25 rounded-circle d-inline-flex align-items-center justify-content-center">
              <i class="bi bi-shield-lock-fill fs-2 text-white"></i>
            </span>
          </div>
          <h4 class="fw-bold mb-1">Welcome Back</h4>
          <p class="small text-white-50 mb-0">Sign in to your candidate or administrator account</p>
        </div>

        <div class="card-body p-4 p-md-5">
          <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label fw-semibold small mb-0">Password</label>
                <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none text-primary">Forgot password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter your password" required>
              </div>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="remember" name="remember">
              <label class="form-check-label small text-muted" for="remember">Keep me logged in</label>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-2 fw-semibold mb-3">
              <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
            </button>
          </form>

          <div class="text-center mt-4">
            <span class="small text-muted">Don't have an account?</span>
            <a href="{{ url_for('auth.register') }}" class="small fw-semibold text-primary ms-1">Create an account</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
